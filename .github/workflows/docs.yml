name: Build and Deploy Documentation

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          cache: "pip"

      - name: Install dependencies
        run: pip install mkdocs-material nf-core

      - name: Generate parameters page from schema
        run: nf-core pipelines schema docs --output docs/parameters.md nextflow_schema.json

      - name: Deploy documentation to GitHub Pages
        run: mkdocs gh-deploy --force
