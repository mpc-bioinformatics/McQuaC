# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "ident_dda"
description: |
  Performs peptide and protein identification for data-dependent acquisition (DDA)
  mass spectrometry data. Optionally generates a decoy database by appending reversed
  or shuffled sequences to the target FASTA, then adjusts a Comet parameter file and
  runs the Comet database search engine to produce peptide spectrum matches (PSMs) in
  mzIdentML format. When label modifications are provided, a second parallel labelled
  search is performed alongside the standard unlabelled search.
keywords:
  - proteomics
  - mass spectrometry
  - DDA
  - peptide identification
  - database search
  - decoy database
  - Comet
  - PSM
components:
  - openms/decoydatabase
  - cometconfig
  - comet
input:
  - fasta:
      type: value
      description: |
        Path to the target protein sequence database in FASTA format.
  - skip_decoy_generation:
      type: value
      description: |
        Boolean flag. When true the decoy database generation step is skipped and
        the input FASTA is used directly for the search.
  - comet_config_template:
      type: value
      description: |
        Path to a Comet parameter file template, or null to use the pipeline default
        at assets/default_configs/comet.params. Search parameters (mass tolerances,
        modifications, etc.) are overwritten at runtime via ext.args on COMETCONFIG.
  - search_labels:
      type: value
      description: |
        Boolean flag. When true a second labelled Comet search is run in parallel
        with the unlabelled search. The label-specific static modifications are
        defined via ext.args on COMETCONFIG_LABELLED in modules.config.
  - ch_mzml:
      type: channel
      description: |
        Channel of mzML spectrum files to search.
        Structure: [ val(meta), path(mzml) ]
      pattern: "*.mzML"
output:
  - mzid:
      type: channel
      description: |
        Channel of mzIdentML result files, one per search (unlabelled, and optionally
        labelled) per input spectrum file. The meta map carries label_search (boolean),
        mzml_id, fasta_id, and params_id fields in addition to the sample id.
        The id field encodes the search type: <sample>-unlabelled or <sample>-labelled.
        Structure: [ val(meta), path(mzid) ]
      pattern: "*.mzid"
authors:
  - "@julianu"
maintainers:
  - "@julianu"
