# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "combinehdf5"
description: Merge all per-metric HDF5 files produced for a single run (e.g. mzML metrics, Thermo/Bruker headers, spike-in metrics) into one combined HDF5 file.
keywords:
  - HDF5
  - quality control
  - mass spectrometry
tools:
  - "combinehdf5":
      description: "Combinehdf5 from the helper tools for the MacProQC pipeline, merging multiple HDF5 files into one."
      homepage: "https://github.com/mpc-bioinformatics/macproqc-helpers"
      documentation: "https://github.com/mpc-bioinformatics/macproqc-helpers"
      tool_dev_url: "https://github.com/mpc-bioinformatics/macproqc-helpers"
      licence:
        - BSD-3

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information. Besides `id`, the following optional keys
          configure the HDF5 combination (defaults in brackets, unset or empty keys use the default;
          they are set per sample in the samplesheet or by the pipeline parameter of the same name):
          - `hdf5_write_metadata` (false): write the `METADATA` node to the combined file
          e.g. `[ id:'sample1', hdf5_write_metadata:true ]`
    - hdf5_files:
        type: file
        description: All per-metric HDF5 files belonging to a single run, to be merged into one
        pattern: "*.hdf5"

output:
  hdf5:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.hdf5":
          type: file
          description: The combined HDF5 file, containing every dataset/group from all input HDF5 files
          pattern: "*.hdf5"
  versions_macproqc_helpers:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "macproqc_helpers":
          type: string
          description: The name of the tool
      - eval('macproqc-helpers --version | sed "s;^macproqc-helpers ;;"'):
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - macproqc_helpers:
          type: string
          description: The name of the tool
      - eval('macproqc-helpers --version | sed "s;^macproqc-helpers ;;"'):
          type: eval
          description: The expression to obtain the version of the tool

authors:
  - "@di-hardt"
maintainers:
  - "@di-hardt"
