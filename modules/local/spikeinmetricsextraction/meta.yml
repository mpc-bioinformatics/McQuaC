# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "spikeinmetricsextraction"
description: Collect spike-in/reference peptide metrics (maximum XIC intensity, retention time, number of identifications) from extracted XICs and identifications, and store them in HDF5 format.
keywords:
  - proteomics
  - xic
  - spike-ins
  - HDF5
  - mass spectrometry
tools:
  - "spikeinmetricsextraction":
      description: "Spikeinmetricsextraction from the helper tools for the MacProQC pipeline, including collection of spike-in/reference peptide metrics."
      homepage: "https://github.com/mpc-bioinformatics/macproqc-helpers"
      documentation: "https://github.com/mpc-bioinformatics/macproqc-helpers"
      tool_dev_url: "https://github.com/mpc-bioinformatics/macproqc-helpers"
      doi: ""
      licence: null
      identifier: null

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - xic_json:
        type: file
        description: Extracted XICs in JSON format (as produced by THERMOXICEXTRACTION/BRUKERXICEXTRACTION)
        pattern: "*.json"
    - identifications:
        type: file
        description: CSV file listing the identifications matched to spike-ins (as produced by XICEXTRACTIONCONFIG)
        pattern: "*.csv"
  - - spike_ins_table:
        type: file
        description: CSV file containing spike-in information
        pattern: "*.{csv}"
        ontologies:
          - edam: "http://edamontology.org/format_3752" # CSV

output:
  hdf5:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.hdf5":
          type: file
          description: HDF5 file containing the spike-in metrics
          pattern: "*.hdf5"
  versions_spikeinmetricsextraction:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "macproqc-helpers":
          type: string
          description: The name of the tool
      - "sha-914105c":
          type: eval
          description: The hardcoded value (fixed in docker)

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The version/tag of the container image

authors:
  - "@di-hardt"
maintainers:
  - "@di-hardt"
