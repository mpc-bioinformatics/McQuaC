# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "brukermetricsextraction"
description: Extract specific metrics from Bruker dot d folders
keywords:
  - bruker
  - proteomics
  - mass_spectrometry
  - dotd
  - metrics_extraction
tools:
  - "brukermetricsextraction":
      description: "Brukermetricsextraction from the helper tools for the McQuaC pipeline, including metric collection from Bruker dot d folders."
      homepage: "https://github.com/mpc-bioinformatics/macproqc-helpers"
      documentation: "https://github.com/mpc-bioinformatics/macproqc-helpers"
      tool_dev_url: "https://github.com/mpc-bioinformatics/macproqc-helpers"
      licence:
        - BSD-3

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information. Besides `id`, the following optional keys
          configure the Bruker metrics extraction (defaults in brackets, unset or empty keys use the default;
          they are set per sample in the samplesheet or by the pipeline parameter of the same name):
          - `bruker_headers_to_parse` (macproqc_helpers defaults): list or comma-separated string of global headers to parse, added to the defaults
          - `bruker_frame_headers_to_parse` (macproqc_helpers defaults): list or comma-separated string of frame headers to parse, added to the defaults
          - `bruker_calibrants` (macproqc_helpers defaults): list or comma-separated string of calibrants as `MZ:Mobility` (e.g. `922.009798:1.1895`), added to the defaults
          - `bruker_calibrants_mz_tolerance` (10): m/z tolerance of the calibrants in Th
          - `bruker_calibrants_mobility_tolerance` (0.1): mobility tolerance of the calibrants in 1/K0
          e.g. `[ id:'sample1', bruker_calibrants_mz_tolerance:15 ]`
    - dotd_bruker_folder:
        type: directory
        description: Bruker dot d folder
        pattern: "*.d"
        # EDAM term for Bruker dot d folder could be added
        # https://github.com/edamontology/edamontology/issues/959

output:
  hdf5:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.hdf5":
          type: file
          description: HDF5 file containing extracted metrics from Bruker dot d folder
          pattern: "*.hdf5"
          ontologies:
            - edam: "http://edamontology.org/format_3590" # HDF5
  versions_macproqc_helpers:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "macproqc_helpers":
          type: string
          description: The name of the tool
      - eval('macproqc-helpers --version | sed "s;^macproqc-helpers ;;"'):
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - macproqc_helpers:
          type: string
          description: The name of the tool
      - eval('macproqc-helpers --version | sed "s;^macproqc-helpers ;;"'):
          type: eval
          description: The expression to obtain the version of the tool

authors:
  - "@Luxxii"
maintainers:
  - "@Luxxii"
